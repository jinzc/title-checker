<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标题原创校验工具（联网版）</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2329; --muted: #646a73;
    --primary: #3370ff; --primary-hover: #295fe0;
    --ok: #34c724; --ok-bg: #e8f7e5; --dup: #f54a45; --dup-bg: #fdecea;
    --warn-bg: #fff3e0; --warn: #ff8800;
    --border: #dee0e3; --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c20; --card: #26292f; --text: #e8eaed; --muted: #9aa0a6;
      --ok-bg: #1e3320; --dup-bg: #3a2224; --warn-bg: #3a2f1c;
      --border: #3d4148;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  }
  .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1; min-width: 240px; padding: 10px 14px; font-size: 15px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg); color: var(--text); outline: none;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  button {
    padding: 10px 24px; font-size: 15px; border: none; border-radius: var(--radius);
    background: var(--primary); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-size: 13px; padding: 6px 14px;
  }
  button.ghost:hover { color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .result {
    margin-top: 16px; padding: 14px 16px; border-radius: var(--radius);
    font-size: 15px; display: none; line-height: 1.7;
  }
  .result.show { display: block; }
  .result.ok { background: var(--ok-bg); border-left: 4px solid var(--ok); }
  .result.dup { background: var(--dup-bg); border-left: 4px solid var(--dup); }
  .result.err { background: var(--warn-bg); border-left: 4px solid var(--warn); }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 13px; font-weight: 600; margin-right: 8px;
  }
  .badge.ok { background: var(--ok); color: #fff; }
  .badge.dup { background: var(--dup); color: #fff; }
  .badge.err { background: var(--warn); color: #fff; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 130px; text-align: center; padding: 14px 8px;
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat.ok .num { color: var(--ok); }
  .stat.dup .num { color: var(--dup); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.tag-ok { color: var(--ok); font-weight: 600; }
  td.tag-dup { color: var(--dup); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 13px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-header h2 { font-size: 16px; }
  .card-header .meta { color: var(--muted); font-size: 12px; }
  .live { display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted); }
  .live::before { content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }
  .cfg-error { background: var(--dup-bg); border-left: 4px solid var(--dup); padding: 14px 16px;
    border-radius: var(--radius); font-size: 14px; line-height: 1.8; display: none; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h1>📋 标题原创校验工具（联网共享版）</h1>
  <div class="subtitle">固定格式：【频道栏目名称】标题 · 以北京时间 0 点清零统计 · 所有使用者数据互通 · 每 10 秒自动同步</div>

  <div class="cfg-error" id="cfgError"></div>

  <!-- 输入校验 -->
  <div class="card">
    <div class="input-row">
      <input type="text" id="inputBox" placeholder="请输入：【新闻联播】这是标题示例"
             autocomplete="off" spellcheck="false">
      <button onclick="check()" id="checkBtn">校验</button>
    </div>
    <div class="hint">
      栏目名须为以下之一：朝闻天下、新闻直播间、午夜新闻、新闻30分、中国新闻、今日环球、共同关注、正点财经、天下财经、体坛快讯、国防军事早报、经济信息联播、军事报道、新闻联播、晚间新闻、24小时。
      若标题与任何使用者的历史输入完全相同则判定为重复。按回车可快速校验。
    </div>
    <div class="result" id="resultBox"></div>
  </div>

  <!-- 今日统计 -->
  <div class="card">
    <div class="card-header">
      <h2>📊 今日统计</h2>
      <span class="meta" id="todayLabel"></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label">总提交</div></div>
      <div class="stat ok"><div class="num" id="statOk">0</div><div class="label">✅ 原创</div></div>
      <div class="stat dup"><div class="num" id="statDup">0</div><div class="label">🔁 重复</div></div>
    </div>
  </div>

  <!-- 历史归档 -->
  <div class="card">
    <div class="card-header">
      <h2>🗂 历史记录</h2>
      <span class="live">实时同步中</span>
    </div>
    <div class="tabs" id="dateTabs"></div>
    <div id="recordList"></div>
  </div>
</div>

<script>
// ================== 配置区（必须修改） ==================
const SUPABASE_URL = "https://ensllppqsrrqtnbxdifk.supabase.co";   // ← 填入 Project Settings → API 里的 Project URL
const SUPABASE_ANON_KEY = "sb_publishable_9nWJupbhHAgQqg1rFfiBVw_gnh_aTRB";            // ← 填入 anon public 那一行的密钥
// =======================================================

const CHANNELS = ["朝闻天下","新闻直播间","午夜新闻","新闻30分","中国新闻","今日环球",
  "共同关注","正点财经","天下财经","体坛快讯","国防军事早报","经济信息联播",
  "军事报道","新闻联播","晚间新闻","24小时"];
const PAGE_SIZE = 500;

function beijingDate(offsetDays = 0) {
  const now = new Date(Date.now() + 8 * 3600 * 1000 + offsetDays * 86400 * 1000);
  return now.toISOString().slice(0, 10);
}
function beijingNow() {
  return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 19).replace("T", " ");
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseInput(raw) {
  const text = raw.trim();
  const m = text.match(/^【([^】]+)】(.+)$/);
  if (!m) return { error: "格式错误：须为 【频道栏目名称】标题" };
  const channel = m[1].trim();
  const title = m[2].trim();
  if (!CHANNELS.includes(channel)) return { error: `栏目「${channel}」不在允许列表中` };
  if (!title) return { error: "标题不能为空" };
  return { channel, title };
}

// ---------- Supabase REST 请求 ----------
async function sb(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.method === "POST" ? "return=representation" : "count=exact"
    }
  }, opts));
  if (!res.ok) throw new Error("请求失败: " + res.status);
  if (res.status === 204) return [];
  return await res.json();
}

// 查询标题是否已存在（数据库层面全等比对）
async function findDuplicateTitle(title) {
  const rows = await sb("records?select=day,input,created_at&title=eq." + encodeURIComponent(title) + "&limit=1");
  return rows.length ? rows[0] : null;
}

// 拉取最近 7 天的记录（页面展示与统计用）
async function fetchRecentDays() {
  const days = [];
  for (let i = 0; i < 7; i++) days.push(beijingDate(-i));
  const inList = days.map(d => '"' + d + '"').join(",");
  return await sb("records?select=created_at,input,channel,title,result,day&day=in.(" + inList + ")&order=created_at.desc&limit=" + PAGE_SIZE);
}

// ---------- 核心校验 ----------
async function check() {
  const box = document.getElementById("inputBox");
  const btn = document.getElementById("checkBtn");
  const resBox = document.getElementById("resultBox");
  const parsed = parseInput(box.value);
  resBox.className = "result show";
  if (parsed.error) {
    resBox.classList.add("err");
    resBox.innerHTML = `<span class="badge err">⚠ 输入无效</span>${escapeHtml(parsed.error)}`;
    return;
  }
  btn.disabled = true;
  try {
    const dup = await findDuplicateTitle(parsed.title);
    const isDup = !!dup;
    // 写入数据库，所有人可见
    await sb("records", {
      method: "POST",
      body: JSON.stringify({
        day: beijingDate(),
        input: box.value.trim(),
        channel: parsed.channel,
        title: parsed.title,
        result: isDup ? "重复" : "原创"
      })
    });
    if (isDup) {
      resBox.classList.add("dup");
      resBox.innerHTML = `<span class="badge dup">🔁 重复</span>标题「<b>${escapeHtml(parsed.title)}」已被${dup.day === beijingDate() ? "今天" : "此前"}输入过（${dup.created_at.replace("T"," ").slice(0,16)}）。`;
    } else {
      resBox.classList.add("ok");
      resBox.innerHTML = `<span class="badge ok">✅ 原创</span>「【${escapeHtml(parsed.channel)}】${escapeHtml(parsed.title)}」校验通过，已记录并向所有人同步。`;
    }
    box.value = "";
    await refresh();
  } catch (e) {
    resBox.classList.add("err");
    resBox.innerHTML = `<span class="badge err">⚠ 网络错误</span>无法连接数据库，请检查网络后重试。`;
  } finally {
    btn.disabled = false;
    box.focus();
  }
}

// ---------- 渲染 ----------
let activeDate = beijingDate();
let cache = [];

async function refresh() {
  try {
    cache = await fetchRecentDays();
    render();
  } catch (e) {
    document.getElementById("recordList").innerHTML =
      `<div class="empty">⚠ 无法连接数据库，请检查配置或网络</div>`;
  }
}

function render() {
  const today = beijingDate();
  const todayList = cache.filter(r => r.day === today);
  document.getElementById("statTotal").textContent = todayList.length;
  document.getElementById("statOk").textContent = todayList.filter(r => r.result === "原创").length;
  document.getElementById("statDup").textContent = todayList.filter(r => r.result === "重复").length;
  document.getElementById("todayLabel").textContent = `北京时间 ${today}（0 点自动清零）`;

  const dates = [...new Set(cache.map(r => r.day))].sort().reverse();
  if (!dates.includes(activeDate) && dates.length) activeDate = dates[0];
  document.getElementById("dateTabs").innerHTML = dates.length
    ? dates.map(d => `<button class="tab ${d === activeDate ? "active" : ""}" onclick="activeDate='${d}';render()">${d}${d === today ? "（今天）" : ""}</button>`).join("")
    : `<span class="empty" style="padding:0">暂无历史记录</span>`;

  const records = cache.filter(r => r.day === activeDate);
  document.getElementById("recordList").innerHTML = records.length ? `
    <table>
      <thead><tr><th style="width:150px">时间</th><th>输入内容</th><th style="width:80px">校验结果</th></tr></thead>
      <tbody>${records.map(r => `
        <tr>
          <td>${r.created_at.replace("T"," ").slice(11,16)}</td>
          <td>${escapeHtml(r.input)}</td>
          <td class="${r.result === "原创" ? "tag-ok" : "tag-dup"}">${r.result === "原创" ? "✅ 原创" : "🔁 重复"}</td>
        </tr>`).join("")}
      </tbody>
    </table>` : `<div class="empty">该日期暂无记录</div>`;
}

// ---------- 启动 ----------
(function init() {
  const errBox = document.getElementById("cfgError");
  if (SUPABASE_URL.includes("你的项目ID") || SUPABASE_ANON_KEY.includes("填入")) {
    errBox.style.display = "block";
    errBox.innerHTML = "<b>⚠ 尚未配置数据库</b><br>请打开本文件的源代码，把顶部配置区的 SUPABASE_URL 和 SUPABASE_ANON_KEY 替换成你自己的 Supabase 项目信息（见部署文档）。";
    document.getElementById("checkBtn").disabled = true;
    return;
  }
  refresh();
  setInterval(refresh, 10000); // 每 10 秒自动同步，看到他人的新输入
})();

document.getElementById("inputBox").addEventListener("keydown", e => {
  if (e.key === "Enter") check();
});
</script>
</body>
</html>
